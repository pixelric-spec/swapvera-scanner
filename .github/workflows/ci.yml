name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm test
      - name: The action on this repository
        uses: ./
        with:
          fail-on: never
          create-issue: 'false'
          ignore: 'src/registry.json,test'
